title: "Houchen Li"
email: "houchen_li@hotmail.com"
description: >-
  Houchen Li is a Senior C++ Software Engineer specializing in HPC & AI Infrastructure,
  high-performance numerical computing, GPU operator development, and autonomous driving systems.
github_username: houchen-li
minimal_mistakes_skin: dark
search: true
locale: "en-US"
timezone: Asia/Shanghai

markdown: kramdown
remote_theme: mmistakes/minimal-mistakes@4.28.0
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name: "Houchen Li"
  avatar: "https://avatars.githubusercontent.com/houchen-li"
  bio: "Senior C++ Software Engineer | HPC & AI Infrastructure"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/houchen-li/"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/houchen-li-b6088a138"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:houchen_li@hotmail.com"
    - label: "X"
      icon: "fab fa-fw fa-x-twitter"
      url: "https://x.com/houchen_li/"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/houchen-li/"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/houchen-li-b6088a138"
    - label: "X"
      icon: "fab fa-fw fa-x-twitter"
      url: "https://x.com/houchen_li/"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      classes: hide-title
  - scope:
      path: "_pages/en"
      type: pages
    values:
      locale: "en"
      lang: en
  - scope:
      path: "_pages/zh"
      type: pages
    values:
      locale: "zh-CN"
      lang: zh-CN
  - scope:
      path: "_posts/en"
      type: posts
    values:
      locale: "en"
      lang: en
      words_per_minute: 200
  - scope:
      path: "_posts/zh"
      type: posts
    values:
      locale: "zh-CN"
      lang: zh-CN
      words_per_minute: 300

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
